apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secret
  namespace: demo
  labels:
    app.kubernetes.io/part-of: gitops-demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: keeper-store
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: HjUYbxcZQYkbJS9rB-7AcQ
        property: password

