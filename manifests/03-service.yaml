apiVersion: v1
kind: Service
metadata:
  name: nginx-demo
  namespace: demo
  labels:
    app.kubernetes.io/name: nginx-demo
    app.kubernetes.io/part-of: gitops-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-demo
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http

